name: Release image

# Push a tag like v0.0.1 to build and publish
# ghcr.io/g-guglielmi/firewall-live-log:{v0.0.1, 0.0.1, latest}
# and create the matching GitHub release with a changelog generated from
# the commits since the previous tag.
#
# Backfill: releases for tags published before this workflow existed can
# be created from the Actions tab (Run workflow -> enter the tag). A
# backfill rebuilds/re-pushes that version's image tags but does NOT move
# :latest, and skips release creation if the release already exists.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.0.1"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: End-to-end test harness (release gate)
        run: python3 test_harness.py

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for the container smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fll-smoke:test

      - name: Container smoke test (root-owned data dir + strict --user mode)
        run: |
          set -euo pipefail
          # 1) Spin-up-and-go: an EMPTY root-owned data dir (the Unraid
          #    appdata default). The entrypoint must fix ownership, the app
          #    must seed a starter devices.json and come up healthy as 10001.
          sudo mkdir -p /tmp/fll-data
          sudo chown -R root:root /tmp/fll-data
          sudo chmod 755 /tmp/fll-data
          docker run -d --name fll-smoke -v /tmp/fll-data:/data \
            -e AUTH_ENABLED=false -p 18080:8080 fll-smoke:test
          ok=""
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && ok=1 && break
            sleep 1
          done
          docker logs fll-smoke
          test -n "$ok"
          uid=$(docker exec fll-smoke python3 -c \
            "print(open('/proc/1/status').read().split('Uid:')[1].split()[0])")
          echo "app pid1 uid=$uid"
          test "$uid" = "10001"
          test "$(sudo stat -c %u /tmp/fll-data)" = "10001"
          test "$(sudo stat -c %u /tmp/fll-data/events.db)" = "10001"
          sudo grep -q "Firewall-1" /tmp/fll-data/devices.json
          test "$(sudo stat -c %u /tmp/fll-data/devices.json)" = "10001"
          docker rm -f fll-smoke
          # 2) Strict mode: --user skips the fix-up; an unwritable dir must
          #    fail fast with the friendly guidance, not a traceback, and the
          #    host dir must be left untouched.
          sudo mkdir -p /tmp/fll-strict
          printf '{"devices":[{"name":"T","port":5514,"vendor":"unifi"}]}' \
            | sudo tee /tmp/fll-strict/devices.json >/dev/null
          sudo chown -R root:root /tmp/fll-strict
          sudo chmod 755 /tmp/fll-strict
          rc=0
          docker run --name fll-strict --user 10001:10001 \
            -v /tmp/fll-strict:/data -e AUTH_ENABLED=false fll-smoke:test || rc=$?
          logs=$(docker logs fll-strict 2>&1)
          echo "$logs"
          test "$rc" = "2"
          echo "$logs" | grep -q "cannot open the event database"
          ! echo "$logs" | grep -q "Traceback"
          test "$(sudo stat -c %u /tmp/fll-strict)" = "0"
          docker rm -f fll-strict

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.TAG }}
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists - skipping"
            exit 0
          fi
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          {
            echo "## Changes"
            git log --no-merges --format='- %s (%h)' "$range"
            echo
            echo "**Image**: \`ghcr.io/$GITHUB_REPOSITORY:$TAG\` (linux/amd64, linux/arm64)"
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG"
            fi
          } > /tmp/notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file /tmp/notes.md --verify-tag
